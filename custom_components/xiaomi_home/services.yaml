get_properties:
  name: Get properties
  description: >-
    Read a raw MIoT property value from a Xiaomi device
    (Lite-Safety service, returns a response).
  fields:
    did:
      name: Device ID
      description: The MIoT device id (did) of the target device.
      required: true
      selector:
        text:
    siid:
      name: Service ID (siid)
      description: The MIoT service id of the property.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    piid:
      name: Property ID (piid)
      description: The MIoT property id.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box

set_properties:
  name: Set properties
  description: >-
    Write a raw MIoT property value on a Xiaomi device
    (Lite-Safety service).
  fields:
    did:
      name: Device ID
      description: The MIoT device id (did) of the target device.
      required: true
      selector:
        text:
    siid:
      name: Service ID (siid)
      description: The MIoT service id of the property.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    piid:
      name: Property ID (piid)
      description: The MIoT property id.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    value:
      name: Value
      description: The value to write.
      required: true

action:
  name: Action
  description: >-
    Call a raw MIoT action on a Xiaomi device (Lite-Safety service).
  fields:
    did:
      name: Device ID
      description: The MIoT device id (did) of the target device.
      required: true
      selector:
        text:
    siid:
      name: Service ID (siid)
      description: The MIoT service id of the action.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    aiid:
      name: Action ID (aiid)
      description: The MIoT action id.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    in_list:
      name: Input parameters
      description: Optional list of input parameters for the action.
      required: false

configure_ai:
  name: Configure AI assistant
  description: >-
    Store the BYOK AI assistant settings (OpenAI-compatible endpoint)
    in Home Assistant storage (Lite-Safety).
  fields:
    base_url:
      name: Base URL
      description: API base URL, e.g. https://api.openai.com/v1
      required: true
      selector:
        text:
    api_key:
      name: API key
      description: API key for the endpoint. Stored in HA storage only.
      required: true
      selector:
        text:
    model:
      name: Model
      description: Model name, e.g. gpt-4o-mini.
      required: true
      selector:
        text:

ask_ai:
  name: Ask AI assistant
  description: >-
    Ask the BYOK AI assistant about the home, optionally allowing it
    to execute one allow-listed service call (Lite-Safety, returns a
    response).
  fields:
    prompt:
      name: Prompt
      description: What to ask the assistant.
      required: true
      selector:
        text:
    allow_control:
      name: Allow control
      description: Allow the assistant to execute one allow-listed service call.
      required: false
      default: false
      selector:
        boolean:
